apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blog
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/Numberbis/pipeline_with_argocd.git
    targetRevision: HEAD
    path: k8s
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
