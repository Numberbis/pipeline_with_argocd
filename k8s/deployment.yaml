apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog
  template:
    metadata:
      labels:
        app: blog
    spec:
      containers:
        - name: blog-nginx
          image: nginx:latest #ghcr.io/Numberbis/pipeline_blog:latest
          ports:
            - containerPort: 80
