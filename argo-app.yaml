apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd-2   # Remplace si tu as mis ArgoCD ailleurs
spec:
  project: default
  source:
    repoURL: 'https://github.com/Numberbis/pipeline_with_argocd.git'
    targetRevision: main
    path: apps/my-app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: my-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

